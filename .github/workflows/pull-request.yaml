name: Automatic Code Quality Tests

on:
  pull_request:

jobs:
  Lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.17"

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run ruff's linter
        run: uv run ruff check .

  Format:
    name: Check formatting with Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.17"

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run ruff's format checker
        run: uv run ruff format --check .

  Type-Check:
    name: Run static analysis with ty
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.17"

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run ty
        run: uv run ty check

  Tests:
    name: Run pytest suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.12.17"

      - name: Setup Python
        run: uv python install

      - name: Install Dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Build leaderboard UI
        run: npm ci --prefix ui && npm run build --prefix ui

      - name: Install screenshot browser
        run: uv run playwright install --with-deps --only-shell chromium

      - name: Run tests
        run: uv run python -m pytest -q tests
